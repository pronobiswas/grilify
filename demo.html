<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            width: 100%;
            height: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #f8f8f8;
            position: fixed;
            top: 0;
            left: 0;
        }
        .logoWrapper{
            width: 20%;
            min-width: 220px;
            height: 100%;
            min-height: 60px;
            position: relative;
            /* border: 2px solid red; */
            padding: 5px;
        }
        .imageBox{
            width: 220px;
            height: fit-content;
            position: absolute;
            top: 0;
            left: 0;
            transition: 0.1s all linear;
            background-color: red;

        }
        .imageBox img{
            width: 100%;
            height: auto;
            /* object-fit: cover; */
            object-fit: contain;
        }
        /* header:hover .logoWrapper{
            overflow: hidden;
        }
        header:hover .imageBox{
            transform: translateY(-100px);
        } */
        #main{
            width: 100%;
            height: 100vh;
            background-color: aliceblue;
        }
        footer{
            width: 100%;
            height: 500px;
            background-color: #000000;
            text-align: center;
            padding: 20px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logoWrapper">
            <div class="imageBox">
                <img src="https://africangod.previewmysite.online/wp-content/uploads/2026/03/moremi_logo_2-removebg-preview-e1774740751977.png" alt="logo.png">
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <button>click</button>
        </nav>
    </header>
    <main id="main">
        <h1>Welcome to Our Website</h1>
        <p>This is a simple example of a basic HTML structure.</p>
    </main>
    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
    <!-- ===================================== -->
     <script>
        document.addEventListener('scroll', function() {
            const header = document.querySelector('header');
            const logoWrapper = document.querySelector('.logoWrapper');
            const imageBox = document.querySelector('.imageBox');
            if (window.scrollY > 50) {

                header.style.color = '#fff';
                imageBox.style.transform = 'translateY(-100px)';
                logoWrapper.style.overflow = 'hidden';
            } else {

                header.style.color = '#000';
                logoWrapper.style.overflow = 'visible';
                imageBox.style.transform = 'translateY(0px)';
            }
        });
     </script>
    <!-- ===================================== -->
</body>
</html>
