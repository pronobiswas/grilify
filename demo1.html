<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wave Rings Animation</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Create multiple rings
    const rings = [];
    const ringCount = 25;
    const geometry = new THREE.RingGeometry(0.5, 0.56, 124);
    const baseColor = new THREE.Color(0x00aaff);

    for (let i = 0; i < ringCount; i++) {
      const material = new THREE.MeshBasicMaterial({
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.8
      });
      const ring = new THREE.Mesh(geometry, material);
      ring.rotateX(Math.PI / 1.5);
      scene.add(ring);
      rings.push({ mesh: ring, offset: i * 0.2 });
    }

    // Animation loop
    function animate(time) {
      requestAnimationFrame(animate);
      const t = time / 10000;

      rings.forEach((ring, i) => {
        const wave = (t + ring.offset) % 2; 
        const scale = 1 + wave * 6; 
        ring.mesh.scale.set(scale, scale, 1);
        ring.mesh.material.opacity = 1 - wave; 
        ring.mesh.rotateY(0.003);
      });

      renderer.render(scene, camera);
    }
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
