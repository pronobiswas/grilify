<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Deep Space Banner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: black;
        }

        canvas {
            display: block;
        }

        #banner {
            width: 100%;
            height: 100vh;
            position: relative;
        }
    </style>
</head>

<body>
    <div id="banner2"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        const banner2 = document.getElementById('banner2');


        // Scene
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.z = 500;

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        banner2.appendChild(renderer.domElement);

        // =========================
        // ⭐ Starfield
        // =========================
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 2000;
        const positions = [];

        for (let i = 0; i < starCount; i++) {
            positions.push((Math.random() - 0.5) * 1000);
            positions.push((Math.random() - 0.5) * 1000);
            positions.push((Math.random() - 0.5) * 1000);
        }

        starGeometry.setAttribute(
            'position',
            new THREE.Float32BufferAttribute(positions, 3)
        );

        const starMaterial = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 1
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // =========================
        // 🌌 Nebula
        // =========================
        const nebulaGeometry = new THREE.SphereGeometry(50, 32, 32);
        const nebulaMaterial = new THREE.MeshBasicMaterial({
            color: 0x2233ff,
            transparent: true,
            opacity: 0.4
        });

        const nebula = new THREE.Mesh(nebulaGeometry, nebulaMaterial);
        scene.add(nebula);

        // =========================
        // 🪐 Torus with Texture + Metal
        // =========================
        const loader = new THREE.TextureLoader();

        // const texture = loader.load('./pic.jpg');
        const texture = loader.load('https://plus.unsplash.com/premium_photo-1681550097108-187abe10d445?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');

        // Improve texture tiling
        texture.mapping = THREE.EquirectangularReflectionMapping;
        texture.encoding = THREE.sRGBEncoding;
        // scene.background = texture;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(20, 20);

        const torusGeometry = new THREE.TorusGeometry(100, 30, 32, 100);

        const torusMaterial = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            envMap: texture,
            metalness: 1,
            roughness: 0.2
        });

        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        scene.add(torus);

        // =========================
        // 💡 Lights (IMPORTANT)
        // =========================

        // Soft ambient light
        // const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        // scene.add(ambientLight);

        // Strong point light
        const pointLight = new THREE.PointLight(0xffffff, 2, 800);
        pointLight.position.set(100, 100, 100);
        // scene.add(pointLight);

        // =========================
        // 🎬 Animation
        // =========================
        function animate() {
            requestAnimationFrame(animate);

            stars.rotation.y += 0.0005;
            nebula.rotation.y += 0.0003;

            torus.rotation.y += 0.01;
            torus.rotation.x += 0.003;

            renderer.render(scene, camera);
        }

        animate();

        // =========================
        // 📱 Resize Fix
        // =========================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
